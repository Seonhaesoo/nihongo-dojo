<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>일본어 도장 · 日本語道場</title>
  <meta name="description" content="한국인 완전 초보를 위한 12주 집중 일본어 학습 앱. 매일 도장을 찍으며 히라가나부터 JLPT N5까지.">
  <meta name="theme-color" content="#f3ecdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="일본어 도장">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="furi-always">
  <!-- 도장(判子)의 번진 잉크 가장자리용 필터 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ink-rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </svg>

  <div id="app">
    <nav class="rail" id="rail" aria-label="주 메뉴"></nav>
    <main class="view" id="view" tabindex="-1">
      <div class="boot">
        <div class="boot__glyph">道</div>
        <p class="boot__text">도장 문을 여는 중…</p>
      </div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p style="padding:2rem">이 앱은 JavaScript가 필요합니다.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
